<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Tycoon: From Qwen to Mythos</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0d0f17;
      --card-bg: #161b26;
      --card-border: #232d42;
      --accent-cyan: #00f2fe;
      --accent-purple: #9d4edd;
      --accent-green: #10b981;
      --text-main: #f3f4f6;
      --text-muted: #8492a6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      padding-bottom: 90px;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .header-card {
      background: linear-gradient(135deg, rgba(157, 78, 221, 0.15), rgba(0, 242, 254, 0.15));
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(0, 242, 254, 0.15);
      color: var(--accent-cyan);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .balance-val {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(90deg, #fff, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
    }

    .stat-item strong {
      color: var(--accent-green);
    }

    .core-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
      position: relative;
    }

    .ai-orb-container {
      position: relative;
      width: 170px;
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ai-orb {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #00f2fe, #7928ca, #0b0f19);
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.06s ease;
      position: relative;
      z-index: 2;
    }

    .ai-orb:active {
      transform: scale(0.92);
    }

    .ai-orb-icon {
      font-size: 46px;
      pointer-events: none;
    }

    .pulse-ring {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 1px dashed rgba(0, 242, 254, 0.4);
      animation: rotateRing 14s linear infinite;
      pointer-events: none;
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .floating-text {
      position: absolute;
      color: var(--accent-cyan);
      font-weight: bold;
      font-size: 18px;
      pointer-events: none;
      animation: floatUp 0.7s ease-out forwards;
      z-index: 10;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-40px); }
    }

    .orb-hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .tabs {
      display: flex;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 16px;
      border: 1px solid var(--card-border);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .item-card.unlocked {
      border-color: rgba(16, 185, 129, 0.4);
    }

    .item-info {
      flex: 1;
    }

    .item-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .item-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .item-gain {
      font-size: 12px;
      color: var(--accent-green);
      font-weight: 600;
      margin-top: 3px;
    }

    .buy-btn {
      background: linear-gradient(135deg, var(--accent-purple), #7928ca);
      border: none;
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 84px;
    }

    .buy-btn:active {
      transform: scale(0.95);
    }

    .buy-btn.disabled {
      background: #252a38 !important;
      color: #5d677d !important;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="header-card">
    <div class="badge" id="current-tier-badge">Уровень: Гаражный кодинг</div>
    <div style="font-size: 12px; color: var(--text-muted);">Сгенерировано токенов</div>
    <div class="balance-val" id="token-balance">0</div>
    <div class="stats-row">
      <div>Генерация: <strong id="tps-rate">+0.0 /c</strong></div>
      <div>Модель: <strong id="current-model-name">Qwen Coder 7B</strong></div>
    </div>
  </div>

  <div class="core-section">
    <div class="ai-orb-container">
      <div class="pulse-ring"></div>
      <div class="ai-orb" id="orb-button">
        <span class="ai-orb-icon">🧠</span>
      </div>
    </div>
    <div class="orb-hint">Тапайте по ядру для разметки синтетических данных</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-btn-models" onclick="switchTab('models')">Архитектуры AI</button>
    <button class="tab-btn" id="tab-btn-hw" onclick="switchTab('hardware')">Кластеры / TPU</button>
  </div>

  <div class="cards-list" id="models-tab"></div>
  <div class="cards-list" id="hardware-tab" style="display: none;"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor('#0d0f17');
    }

    let state = {
      tokens: 0,
      tokensPerClick: 1,
      currentModelIndex: 0
    };

    const models = [
      { name: "Qwen Coder 7B", tier: "Гараж", cost: 0, rate: 0.5, icon: "⚡", unlocked: true },
      { name: "DeepSeek 67B", tier: "Стартап", cost: 150, rate: 4.0, icon: "🔥", unlocked: false },
      { name: "Llama 3 405B", tier: "Скейлинг", cost: 800, rate: 25.0, icon: "🌌", unlocked: false },
      { name: "Claude 3.5 Opus", tier: "Корпорация", cost: 3500, rate: 120.0, icon: "💎", unlocked: false },
      { name: "Mythos 5 (AGI)", tier: "Сингулярность", cost: 15000, rate: 600.0, icon: "👑", unlocked: false }
    ];

    const hardware = [
      { id: 'gpu', name: 'RTX 4090 Кластер', cost: 30, baseRate: 0.8, count: 0, icon: '🖥️' },
      { id: 'rack', name: 'Стойка H100 SXM5', cost: 250, baseRate: 6.0, count: 0, icon: '🖲️' },
      { id: 'datacenter', name: 'Дата-центр с подстанцией', cost: 1200, baseRate: 35.0, count: 0, icon: '🏢' },
      { id: 'orbital', name: 'Орбитальный квантовый массив', cost: 6000, baseRate: 180.0, count: 0, icon: '🛰️' }
    ];

    // Загрузка сохранения
    try {
      const saved = localStorage.getItem('ai_tycoon_save');
      if (saved) {
        const parsed = JSON.parse(saved);
        state.tokens = parsed.tokens || 0;
        state.currentModelIndex = parsed.currentModelIndex || 0;
        state.tokensPerClick = state.currentModelIndex + 1;
        if (parsed.models) {
          parsed.models.forEach((u, i) => { if (models[i]) models[i].unlocked = u; });
        }
        if (parsed.hardware) {
          parsed.hardware.forEach((c, i) => { if (hardware[i]) hardware[i].count = c; });
        }
      }
    } catch (e) {}

    function saveGame() {
      try {
        localStorage.setItem('ai_tycoon_save', JSON.stringify({
          tokens: state.tokens,
          currentModelIndex: state.currentModelIndex,
          models: models.map(m => m.unlocked),
          hardware: hardware.map(h => h.count)
        }));
      } catch (e) {}
    }

    function getHwCost(idx) {
      return Math.floor(hardware[idx].cost * Math.pow(1.15, hardware[idx].count));
    }

    function getTotalRate() {
      const modelIncome = models[state.currentModelIndex].rate;
      const hwIncome = hardware.reduce((sum, item) => sum + (item.count * item.baseRate), 0);
      return modelIncome + hwIncome;
    }

    // Создание DOM элементов (один раз)
    function initDOM() {
      const mContainer = document.getElementById('models-tab');
      mContainer.innerHTML = models.map((m, idx) => `
        <div class="item-card" id="model-card-${idx}">
          <div class="item-info">
            <div class="item-title">${m.icon} ${m.name}</div>
            <div class="item-desc">${m.tier} архитектура</div>
            <div class="item-gain">+${m.rate}/сек</div>
          </div>
          <button class="buy-btn" id="model-btn-${idx}" onclick="handleModelClick(${idx})"></button>
        </div>
      `).join('');

      const hContainer = document.getElementById('hardware-tab');
      hContainer.innerHTML = hardware.map((hw, idx) => `
        <div class="item-card">
          <div class="item-info">
            <div class="item-title" id="hw-title-${idx}">${hw.icon} ${hw.name} (${hw.count})</div>
            <div class="item-desc">Кластерное ускорение</div>
            <div class="item-gain">+${hw.baseRate}/сек за блок</div>
          </div>
          <button class="buy-btn" id="hw-btn-${idx}" onclick="handleHwClick(${idx})">
            <span id="hw-cost-${idx}">0</span>
            <span style="font-size:9px; opacity:0.8;">КУПИТЬ</span>
          </button>
        </div>
      `).join('');

      updateStaticUI();
    }

    // Обновление статических названий и кнопок при покупке
    function updateStaticUI() {
      models.forEach((m, idx) => {
        const btn = document.getElementById(`model-btn-${idx}`);
        const card = document.getElementById(`model-card-${idx}`);
        if (state.currentModelIndex === idx) {
          card.classList.add('unlocked');
          btn.innerHTML = `<span>АКТИВНА</span>`;
          btn.style.background = '#10b981';
        } else if (m.unlocked) {
          card.classList.remove('unlocked');
          btn.innerHTML = `<span>ВЫБРАТЬ</span>`;
          btn.style.background = 'linear-gradient(135deg, var(--accent-purple), #7928ca)';
        } else {
          card.classList.remove('unlocked');
          btn.innerHTML = `<span>${m.cost} 🪙</span><span style="font-size:9px; opacity:0.8;">ОБУЧИТЬ</span>`;
          btn.style.background = 'linear-gradient(135deg, var(--accent-purple), #7928ca)';
        }
      });

      hardware.forEach((hw, idx) => {
        document.getElementById(`hw-title-${idx}`).textContent = `${hw.icon} ${hw.name} (${hw.count})`;
        document.getElementById(`hw-cost-${idx}`).textContent = `${getHwCost(idx)} 🪙`;
      });

      document.getElementById('current-model-name').textContent = models[state.currentModelIndex].name;
      document.getElementById('current-tier-badge').textContent = `Уровень: ${models[state.currentModelIndex].tier}`;
      document.getElementById('tps-rate').textContent = `+${getTotalRate().toFixed(1)} /c`;
    }

    // Быстрый тик для баланса и доступности кнопок (без перерисовки DOM)
    function tickUI() {
      document.getElementById('token-balance').textContent = Math.floor(state.tokens).toLocaleString();

      models.forEach((m, idx) => {
        const btn = document.getElementById(`model-btn-${idx}`);
        if (!m.unlocked && state.tokens < m.cost) {
          btn.classList.add('disabled');
        } else {
          btn.classList.remove('disabled');
        }
      });

      hardware.forEach((hw, idx) => {
        const btn = document.getElementById(`hw-btn-${idx}`);
        if (state.tokens < getHwCost(idx)) {
          btn.classList.add('disabled');
        } else {
          btn.classList.remove('disabled');
        }
      });
    }

    // Обработка кликов
    window.handleModelClick = function(idx) {
      if (state.currentModelIndex === idx) return;
      
      if (models[idx].unlocked) {
        state.currentModelIndex = idx;
        state.tokensPerClick = idx + 1;
        if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        updateStaticUI();
        saveGame();
      } else if (state.tokens >= models[idx].cost) {
        state.tokens -= models[idx].cost;
        models[idx].unlocked = true;
        state.currentModelIndex = idx;
        state.tokensPerClick = idx + 1;
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        updateStaticUI();
        saveGame();
      }
    };

    window.handleHwClick = function(idx) {
      const cost = getHwCost(idx);
      if (state.tokens >= cost) {
        state.tokens -= cost;
        hardware[idx].count++;
        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        updateStaticUI();
        saveGame();
      }
    };

    // Клик по ядру
    const orb = document.getElementById('orb-button');
    orb.addEventListener('pointerdown', (e) => {
      state.tokens += state.tokensPerClick;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

      const text = document.createElement('div');
      text.className = 'floating-text';
      text.textContent = `+${state.tokensPerClick}`;
      text.style.left = `${e.clientX - 10}px`;
      text.style.top = `${e.clientY - 20}px`;
      document.body.appendChild(text);
      setTimeout(() => text.remove(), 700);
      tickUI();
    });

    window.switchTab = function(tab) {
      if (tab === 'models') {
        document.getElementById('tab-btn-models').classList.add('active');
        document.getElementById('tab-btn-hw').classList.remove('active');
        document.getElementById('models-tab').style.display = 'flex';
        document.getElementById('hardware-tab').style.display = 'none';
      } else {
        document.getElementById('tab-btn-hw').classList.add('active');
        document.getElementById('tab-btn-models').classList.remove('active');
        document.getElementById('hardware-tab').style.display = 'flex';
        document.getElementById('models-tab').style.display = 'none';
      }
    };

    initDOM();

    // Игровой цикл
    setInterval(() => {
      state.tokens += getTotalRate() / 10;
      tickUI();
    }, 100);

    // Автосохранение раз в 3 секунды
    setInterval(saveGame, 3000);
  </script>
</body>
</html>
