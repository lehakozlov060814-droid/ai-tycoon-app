<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Studio Tycoon</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0c0e14;
      --card-bg: #141822;
      --card-border: #1f2637;
      --accent-cyan: #00f2fe;
      --accent-purple: #8b5cf6;
      --accent-green: #10b981;
      --accent-gold: #f59e0b;
      --accent-red: #ef4444;
      --text-main: #f9fafb;
      --text-muted: #8492a6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 12px;
      padding-bottom: 80px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Верхний дашборд */
    .dashboard {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.12), rgba(0, 242, 254, 0.08));
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .dash-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      font-size: 10px;
      text-transform: uppercase;
      padding: 3px 7px;
      border-radius: 6px;
      background: rgba(0, 242, 254, 0.12);
      color: var(--accent-cyan);
      font-weight: 700;
    }

    .elo-badge {
      font-size: 10px;
      padding: 3px 7px;
      border-radius: 6px;
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-gold);
      font-weight: 700;
    }

    .balance-box {
      margin: 6px 0 4px;
    }

    .balance-val {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(90deg, #fff, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 11px;
      text-align: center;
    }

    .stat-pill {
      background: rgba(0,0,0,0.25);
      padding: 4px;
      border-radius: 6px;
    }

    .stat-pill span { color: var(--text-muted); display: block; font-size: 9px; }
    .stat-pill strong { color: #fff; }

    /* Центральная зона инференса */
    .core-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 12px;
    }

    .orb-mini-container {
      position: relative;
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ai-orb {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #00f2fe, #8b5cf6, #090d16);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      transition: transform 0.05s ease;
    }

    .ai-orb:active { transform: scale(0.9); }
    .ai-orb.boosted {
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.7);
      background: radial-gradient(circle at 35% 35%, #ef4444, #f59e0b, #090d16);
    }

    .core-info {
      flex: 1;
      margin-left: 12px;
    }

    .turbo-btn {
      background: linear-gradient(135deg, #ef4444, #f59e0b);
      border: none;
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }

    .turbo-btn.disabled {
      background: #232838;
      color: #64748b;
      cursor: not-allowed;
    }

    /* Навигация */
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--card-bg);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 12px;
      border: 1px solid var(--card-border);
      gap: 3px;
    }

    .tab-btn {
      padding: 8px 2px;
      text-align: center;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    /* Карточки */
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card.active-model {
      border-color: rgba(16, 185, 129, 0.5);
    }

    .card-info {
      flex: 1;
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-desc {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .action-btn {
      background: linear-gradient(135deg, var(--accent-purple), #6d28d9);
      border: none;
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 74px;
    }

    .action-btn:active { transform: scale(0.95); }
    .action-btn.disabled {
      background: #232838 !important;
      color: #5d677d !important;
      opacity: 0.6;
    }

    .action-btn.success {
      background: #10b981 !important;
    }

    /* Прогресс-бар контрактов */
    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent-cyan);
      width: 0%;
      transition: width 0.1s linear;
    }

    .floating-num {
      position: absolute;
      color: var(--accent-cyan);
      font-weight: bold;
      font-size: 15px;
      pointer-events: none;
      animation: floatUp 0.6s ease-out forwards;
      z-index: 10;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-30px); }
    }
  </style>
</head>
<body>

  <!-- Верхняя панель -->
  <div class="dashboard">
    <div class="dash-top">
      <div class="badge" id="tier-badge">Стадия: Гараж</div>
      <div class="elo-badge" id="elo-badge">🏆 Arena Elo: 1000</div>
    </div>
    <div class="balance-box">
      <div style="font-size: 10px; color: var(--text-muted);">Баланс токенов</div>
      <div class="balance-val" id="balance">0</div>
    </div>
    <div class="stats-grid">
      <div class="stat-pill"><span>💻 КОДИНГ</span><strong id="stat-code">1</strong></div>
      <div class="stat-pill"><span>🧩 ЛОГИКА</span><strong id="stat-logic">1</strong></div>
      <div class="stat-pill"><span>🎨 КРЕАТИВ</span><strong id="stat-creative">1</strong></div>
    </div>
  </div>

  <!-- Ядро разметки данных + Сбалансированный буст -->
  <div class="core-area">
    <div class="orb-mini-container">
      <div class="ai-orb" id="orb-button">🧠</div>
    </div>
    <div class="core-info">
      <div style="font-size: 12px; font-weight: 700;" id="model-display-name">Qwen 2.5 Coder</div>
      <div style="font-size: 10px; color: var(--text-muted);" id="tps-display">+1.0 токенов/сек</div>
      <button class="turbo-btn" id="turbo-btn" onclick="triggerOverclock()">⚡ ОВЕРКЛОК x2.5 (10с)</button>
    </div>
  </div>

  <!-- Вкладки меню -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-contracts-btn" onclick="openTab('contracts')">💼 Заказы</button>
    <button class="tab-btn" id="tab-models-btn" onclick="openTab('models')">🧠 Модели</button>
    <button class="tab-btn" id="tab-tune-btn" onclick="openTab('tuning')">🎯 LoRA тюнинг</button>
    <button class="tab-btn" id="tab-hw-btn" onclick="openTab('hardware')">🖥️ Кластеры</button>
  </div>

  <!-- Контейнеры секций -->
  <div class="cards-container" id="contracts-tab"></div>
  <div class="cards-container" id="models-tab" style="display: none;"></div>
  <div class="cards-container" id="tuning-tab" style="display: none;"></div>
  <div class="cards-container" id="hardware-tab" style="display: none;"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor('#0c0e14');
    }

    let state = {
      tokens: 0,
      currentModelIndex: 0,
      codeStat: 1,
      logicStat: 1,
      creativeStat: 1,
      elo: 1000,
      overclockUntil: 0,
      overclockCooldownUntil: 0,
      activeContract: null
    };

    const models = [
      { name: "Qwen 2.5 Coder (7B)", tier: "Гараж", cost: 0, baseRate: 1.0, codeBonus: 1, logicBonus: 1, creativeBonus: 0, unlocked: true },
      { name: "DeepSeek V3 (671B)", tier: "Стартап", cost: 250, baseRate: 6.0, codeBonus: 4, logicBonus: 3, creativeBonus: 1, unlocked: false },
      { name: "Claude 3.5 Sonnet", tier: "Продакшн", cost: 1500, baseRate: 25.0, codeBonus: 8, logicBonus: 8, creativeBonus: 8, unlocked: false },
      { name: "DeepSeek R1 (Reasoning)", tier: "Мышление", cost: 8000, baseRate: 110.0, codeBonus: 12, logicBonus: 20, creativeBonus: 4, unlocked: false },
      { name: "Mythos 5 (ASI)", tier: "Сингулярность", cost: 50000, baseRate: 600.0, codeBonus: 40, logicBonus: 40, creativeBonus: 40, unlocked: false }
    ];

    const hardware = [
      { id: 'gpu', name: 'Кластер RTX 4090', cost: 30, rate: 0.8, count: 0, icon: '🖥️' },
      { id: 'rack', name: 'Стойка H100 SXM5', cost: 200, rate: 5.0, count: 0, icon: '🖲️' },
      { id: 'pod', name: 'Модульный Дата-центр', cost: 1200, rate: 30.0, count: 0, icon: '🏢' },
      { id: 'quantum', name: 'Квантовый инференс-узел', cost: 7000, rate: 180.0, count: 0, icon: '🛰️' }
    ];

    // Динамические коммерческие API-заказы
    const contractsPool = [
      { id: 'tg_bot', title: '🤖 Чат-бот для интернет-магазина', desc: 'Автоматизация техподдержки', reqCode: 2, reqLogic: 1, reqCreative: 1, reward: 80, eloGain: 15, duration: 4000 },
      { id: 'fin_analyst', title: '📈 Финансовый скоринг акций', desc: 'Анализ рыночных отчетов', reqCode: 3, reqLogic: 5, reqCreative: 1, reward: 320, eloGain: 25, duration: 7000 },
      { id: 'game_lore', title: '🎮 Генерация диалогов для RPG', desc: 'Создание 5000 строк сценария', reqCode: 2, reqLogic: 3, reqCreative: 6, reward: 650, eloGain: 35, duration: 9000 },
      { id: 'compiler', title: '⚡ Оптимизация C++ компилятора', desc: 'Рефакторинг низкоуровневого ядра', reqCode: 12, reqLogic: 10, reqCreative: 2, reward: 2400, eloGain: 50, duration: 12000 },
      { id: 'agi_proof', title: '👑 Доказательство гипотезы Римана', desc: 'Прорывное математическое доказательство', reqCode: 25, reqLogic: 35, reqCreative: 15, reward: 12000, eloGain: 100, duration: 18000 }
    ];

    // Загрузка
    try {
      const saved = localStorage.getItem('ai_tycoon_v3_save');
      if (saved) {
        const parsed = JSON.parse(saved);
        state = { ...state, ...parsed };
        if (parsed.unlockedModels) {
          parsed.unlockedModels.forEach((u, i) => { if (models[i]) models[i].unlocked = u; });
        }
        if (parsed.hardwareCount) {
          parsed.hardwareCount.forEach((c, i) => { if (hardware[i]) hardware[i].count = c; });
        }
      }
    } catch (e) {}

    function saveGame() {
      try {
        localStorage.setItem('ai_tycoon_v3_save', JSON.stringify({
          tokens: state.tokens,
          currentModelIndex: state.currentModelIndex,
          codeStat: state.codeStat,
          logicStat: state.logicStat,
          creativeStat: state.creativeStat,
          elo: state.elo,
          unlockedModels: models.map(m => m.unlocked),
          hardwareCount: hardware.map(h => h.count)
        }));
      } catch (e) {}
    }

    function isBoosted() {
      return Date.now() < state.overclockUntil;
    }

    function getHwCost(idx) {
      return Math.floor(hardware[idx].cost * Math.pow(1.16, hardware[idx].count));
    }

    function getTotalCode() { return state.codeStat + models[state.currentModelIndex].codeBonus; }
    function getTotalLogic() { return state.logicStat + models[state.currentModelIndex].logicBonus; }
    function getTotalCreative() { return state.creativeStat + models[state.currentModelIndex].creativeBonus; }

    function getTotalRate() {
      const modelIncome = models[state.currentModelIndex].baseRate;
      const hwIncome = hardware.reduce((acc, h) => acc + (h.count * h.rate), 0);
      let total = modelIncome + hwIncome;
      if (isBoosted()) total *= 2.5; // Сбалансированный нёрф буста
      return total;
    }

    function getTuneCost(statVal) {
      return Math.floor(35 * Math.pow(1.35, statVal - 1));
    }

    // Инициализация DOM
    function initDOM() {
      // 1. Контракты
      document.getElementById('contracts-tab').innerHTML = contractsPool.map((c, idx) => `
        <div class="card" id="contract-card-${idx}">
          <div class="card-info">
            <div class="card-title">${c.title}</div>
            <div class="card-desc">${c.desc}</div>
            <div style="font-size:10px; color:var(--text-muted); margin-top:3px;">
              Требуется: 💻${c.reqCode} 🧩${c.reqLogic} 🎨${c.reqCreative}
            </div>
            <div class="progress-track" id="prog-track-${idx}" style="display:none;">
              <div class="progress-fill" id="prog-fill-${idx}"></div>
            </div>
          </div>
          <button class="action-btn" id="contract-btn-${idx}" onclick="startContract(${idx})">
            <span>+${c.reward} 🪙</span>
            <span style="font-size:8px; opacity:0.8;">ВЫПОЛНИТЬ</span>
          </button>
        </div>
      `).join('');

      // 2. Модели
      document.getElementById('models-tab').innerHTML = models.map((m, idx) => `
        <div class="card" id="model-card-${idx}">
          <div class="card-info">
            <div class="card-title">${m.name}</div>
            <div class="card-desc">${m.tier} архитектура | +${m.baseRate}/с</div>
            <div style="font-size:10px; color:var(--accent-cyan); margin-top:2px;">
              Бонусы: 💻+${m.codeBonus} 🧩+${m.logicBonus} 🎨+${m.creativeBonus}
            </div>
          </div>
          <button class="action-btn" id="model-btn-${idx}" onclick="handleModelClick(${idx})"></button>
        </div>
      `).join('');

      // 3. Тюнинг LoRA
      document.getElementById('tuning-tab').innerHTML = `
        <div class="card">
          <div class="card-info">
            <div class="card-title">💻 Кодовый датасет (HumanEval)</div>
            <div class="card-desc">Повышает навык программирования для сложных контрактов</div>
          </div>
          <button class="action-btn" id="tune-code-btn" onclick="tuneStat('code')">
            <span id="tune-code-cost">0</span><span style="font-size:8px;">LoRA +1</span>
          </button>
        </div>
        <div class="card">
          <div class="card-info">
            <div class="card-title">🧩 Математический CoT (GSM8K)</div>
            <div class="card-desc">Повышает глубину логического мышления модели</div>
          </div>
          <button class="action-btn" id="tune-logic-btn" onclick="tuneStat('logic')">
            <span id="tune-logic-cost">0</span><span style="font-size:8px;">LoRA +1</span>
          </button>
        </div>
        <div class="card">
          <div class="card-info">
            <div class="card-title">🎨 Синтетический RLHF (Creative)</div>
            <div class="card-desc">Повышает выразительность и креативность генераций</div>
          </div>
          <button class="action-btn" id="tune-creative-btn" onclick="tuneStat('creative')">
            <span id="tune-creative-cost">0</span><span style="font-size:8px;">LoRA +1</span>
          </button>
        </div>
      `;

      // 4. Железо
      document.getElementById('hardware-tab').innerHTML = hardware.map((hw, idx) => `
        <div class="card">
          <div class="card-info">
            <div class="card-title" id="hw-title-${idx}">${hw.icon} ${hw.name} (${hw.count})</div>
            <div class="card-desc">+${hw.rate}/сек фоновой вычислительной мощности</div>
          </div>
          <button class="action-btn" id="hw-btn-${idx}" onclick="buyHardware(${idx})">
            <span id="hw-cost-${idx}">0</span>
            <span style="font-size:8px;">КУПИТЬ</span>
          </button>
        </div>
      `).join('');

      updateStaticUI();
    }

    function updateStaticUI() {
      // Статы в шапке
      document.getElementById('stat-code').textContent = getTotalCode();
      document.getElementById('stat-logic').textContent = getTotalLogic();
      document.getElementById('stat-creative').textContent = getTotalCreative();
      document.getElementById('elo-badge').textContent = `🏆 Arena Elo: ${state.elo}`;
      document.getElementById('tier-badge').textContent = `Стадия: ${models[state.currentModelIndex].tier}`;
      document.getElementById('model-display-name').textContent = models[state.currentModelIndex].name;
      document.getElementById('tps-display').textContent = `+${getTotalRate().toFixed(1)} токенов/сек`;

      // Модели
      models.forEach((m, idx) => {
        const btn = document.getElementById(`model-btn-${idx}`);
        const card = document.getElementById(`model-card-${idx}`);
        if (state.currentModelIndex === idx) {
          card.classList.add('active-model');
          btn.innerHTML = `<span>АКТИВНА</span>`;
          btn.className = 'action-btn success';
        } else if (m.unlocked) {
          card.classList.remove('active-model');
          btn.innerHTML = `<span>ВЫБРАТЬ</span>`;
          btn.className = 'action-btn';
        } else {
          card.classList.remove('active-model');
          btn.innerHTML = `<span>${m.cost} 🪙</span><span style="font-size:8px;">ОБУЧИТЬ</span>`;
          btn.className = 'action-btn';
        }
      });

      // Стоимость тюнинга
      document.getElementById('tune-code-cost').textContent = `${getTuneCost(state.codeStat)} 🪙`;
      document.getElementById('tune-logic-cost').textContent = `${getTuneCost(state.logicStat)} 🪙`;
      document.getElementById('tune-creative-cost').textContent = `${getTuneCost(state.creativeStat)} 🪙`;

      // Железо
      hardware.forEach((hw, idx) => {
        document.getElementById(`hw-title-${idx}`).textContent = `${hw.icon} ${hw.name} (${hw.count})`;
        document.getElementById(`hw-cost-${idx}`).textContent = `${getHwCost(idx)} 🪙`;
      });
    }

    function tickUI() {
      document.getElementById('balance').textContent = Math.floor(state.tokens).toLocaleString();

      // Доступность контрактов по статам
      contractsPool.forEach((c, idx) => {
        const btn = document.getElementById(`contract-btn-${idx}`);
        const hasStats = getTotalCode() >= c.reqCode && getTotalLogic() >= c.reqLogic && getTotalCreative() >= c.reqCreative;
        if (!hasStats || state.activeContract !== null) {
          btn.classList.add('disabled');
        } else {
          btn.classList.remove('disabled');
        }
      });

      // Доступность моделей
      models.forEach((m, idx) => {
        const btn = document.getElementById(`model-btn-${idx}`);
        if (!m.unlocked && state.tokens < m.cost) btn.classList.add('disabled');
        else if (!m.unlocked) btn.classList.remove('disabled');
      });

      // Доступность тюнинга
      document.getElementById('tune-code-btn').classList.toggle('disabled', state.tokens < getTuneCost(state.codeStat));
      document.getElementById('tune-logic-btn').classList.toggle('disabled', state.tokens < getTuneCost(state.logicStat));
      document.getElementById('tune-creative-btn').classList.toggle('disabled', state.tokens < getTuneCost(state.creativeStat));

      // Доступность железа
      hardware.forEach((hw, idx) => {
        document.getElementById(`hw-btn-${idx}`).classList.toggle('disabled', state.tokens < getHwCost(idx));
      });

      // Таймер оверклока
      const now = Date.now();
      const orb = document.getElementById('orb-button');
      const turboBtn = document.getElementById('turbo-btn');
      if (now < state.overclockUntil) {
        orb.classList.add('boosted');
        turboBtn.classList.remove('disabled');
        turboBtn.textContent = `⚡ АКТИВНО (${Math.ceil((state.overclockUntil - now)/1000)}с)`;
      } else {
        orb.classList.remove('boosted');
        if (now < state.overclockCooldownUntil) {
          turboBtn.classList.add('disabled');
          turboBtn.textContent = `Кулдаун (${Math.ceil((state.overclockCooldownUntil - now)/1000)}с)`;
        } else {
          turboBtn.classList.remove('disabled');
          turboBtn.textContent = `⚡ ОВЕРКЛОК x2.5 (10с)`;
        }
      }
    }

    // Запуск выполнения контракта
    window.startContract = function(idx) {
      if (state.activeContract !== null) return;
      const c = contractsPool[idx];
      if (getTotalCode() < c.reqCode || getTotalLogic() < c.reqLogic || getTotalCreative() < c.reqCreative) return;

      state.activeContract = idx;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

      const track = document.getElementById(`prog-track-${idx}`);
      const fill = document.getElementById(`prog-fill-${idx}`);
      const btn = document.getElementById(`contract-btn-${idx}`);

      track.style.display = 'block';
      btn.classList.add('disabled');
      btn.innerHTML = `<span>РАБОТА...</span>`;

      const startTime = Date.now();
      const interval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(100, (elapsed / c.duration) * 100);
        fill.style.width = `${progress}%`;

        if (elapsed >= c.duration) {
          clearInterval(interval);
          track.style.display = 'none';
          fill.style.width = '0%';
          btn.innerHTML = `<span>+${c.reward} 🪙</span><span style="font-size:8px;">ВЫПОЛНИТЬ</span>`;
          
          state.tokens += c.reward;
          state.elo += c.eloGain;
          state.activeContract = null;
          
          if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
          updateStaticUI();
          saveGame();
        }
      }, 100);
    };

    // LoRA Дообучение
    window.tuneStat = function(type) {
      if (type === 'code') {
        const cost = getTuneCost(state.codeStat);
        if (state.tokens >= cost) {
          state.tokens -= cost;
          state.codeStat++;
        }
      } else if (type === 'logic') {
        const cost = getTuneCost(state.logicStat);
        if (state.tokens >= cost) {
          state.tokens -= cost;
          state.logicStat++;
        }
      } else if (type === 'creative') {
        const cost = getTuneCost(state.creativeStat);
        if (state.tokens >= cost) {
          state.tokens -= cost;
          state.creativeStat++;
        }
      }
      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
      updateStaticUI();
      saveGame();
    };

    // Модели
    window.handleModelClick = function(idx) {
      if (state.currentModelIndex === idx) return;
      if (models[idx].unlocked) {
        state.currentModelIndex = idx;
        if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
      } else if (state.tokens >= models[idx].cost) {
        state.tokens -= models[idx].cost;
        models[idx].unlocked = true;
        state.currentModelIndex = idx;
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      }
      updateStaticUI();
      saveGame();
    };

    // Покупка железа
    window.buyHardware = function(idx) {
      const cost = getHwCost(idx);
      if (state.tokens >= cost) {
        state.tokens -= cost;
        hardware[idx].count++;
        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        updateStaticUI();
        saveGame();
      }
    };

    // Оверклок
    window.triggerOverclock = function() {
      const now = Date.now();
      if (now < state.overclockCooldownUntil || now < state.overclockUntil) return;
      state.overclockUntil = now + 10000;
      state.overclockCooldownUntil = now + 40000;
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
      updateStaticUI();
    };

    // Тап по ядру
    document.getElementById('orb-button').addEventListener('pointerdown', (e) => {
      let clickPower = (state.currentModelIndex + 1);
      if (isBoosted()) clickPower = Math.ceil(clickPower * 2.5);
      state.tokens += clickPower;

      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

      const text = document.createElement('div');
      text.className = 'floating-num';
      text.textContent = `+${clickPower}`;
      text.style.left = `${e.clientX - 10}px`;
      text.style.top = `${e.clientY - 15}px`;
      document.body.appendChild(text);
      setTimeout(() => text.remove(), 600);
      tickUI();
    });

    window.openTab = function(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('contracts-tab').style.display = 'none';
      document.getElementById('models-tab').style.display = 'none';
      document.getElementById('tuning-tab').style.display = 'none';
      document.getElementById('hardware-tab').style.display = 'none';

      if (tab === 'contracts') {
        document.getElementById('tab-contracts-btn').classList.add('active');
        document.getElementById('contracts-tab').style.display = 'flex';
      } else if (tab === 'models') {
        document.getElementById('tab-models-btn').classList.add('active');
        document.getElementById('models-tab').style.display = 'flex';
      } else if (tab === 'tuning') {
        document.getElementById('tab-tune-btn').classList.add('active');
        document.getElementById('tuning-tab').style.display = 'flex';
      } else {
        document.getElementById('tab-hw-btn').classList.add('active');
        document.getElementById('hardware-tab').style.display = 'flex';
      }
    };

    initDOM();

    setInterval(() => {
      state.tokens += getTotalRate() / 10;
      tickUI();
    }, 100);

    setInterval(saveGame, 3000);
  </script>
</body>
</html>
