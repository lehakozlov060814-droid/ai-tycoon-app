<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Tycoon: Next Gen</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0b0d14;
      --card-bg: #141824;
      --card-border: #202738;
      --accent-cyan: #00f2fe;
      --accent-purple: #9d4edd;
      --accent-green: #10b981;
      --accent-gold: #ffb703;
      --accent-red: #ff0055;
      --text-main: #f3f4f6;
      --text-muted: #8492a6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 14px;
      padding-bottom: 90px;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Статистика */
    .header-card {
      background: linear-gradient(135deg, rgba(157, 78, 221, 0.12), rgba(0, 242, 254, 0.12));
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
      backdrop-filter: blur(8px);
    }

    .top-badges {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .badge {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(0, 242, 254, 0.15);
      color: var(--accent-cyan);
      font-weight: 700;
    }

    .prestige-badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(255, 183, 3, 0.15);
      color: var(--accent-gold);
      font-weight: 700;
    }

    .balance-val {
      font-size: 30px;
      font-weight: 800;
      background: linear-gradient(90deg, #fff, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
    }

    .stat-item strong {
      color: var(--accent-green);
    }

    /* Ядро и кнопка турбо */
    .core-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 14px 0;
      position: relative;
    }

    .ai-orb-container {
      position: relative;
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ai-orb {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #00f2fe, #7928ca, #0b0f19);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.05s ease;
      position: relative;
      z-index: 2;
    }

    .ai-orb.overclocked {
      background: radial-gradient(circle at 35% 35%, #ff0055, #ffb703, #0b0f19);
      box-shadow: 0 0 35px rgba(255, 0, 85, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.5);
      animation: shake 0.3s infinite;
    }

    @keyframes shake {
      0% { transform: translate(1px, 1px); }
      50% { transform: translate(-1px, -1px); }
      100% { transform: translate(1px, -1px); }
    }

    .ai-orb:active {
      transform: scale(0.92);
    }

    .ai-orb-icon {
      font-size: 42px;
      pointer-events: none;
    }

    .pulse-ring {
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 1px dashed rgba(0, 242, 254, 0.3);
      animation: rotateRing 14s linear infinite;
      pointer-events: none;
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .floating-text {
      position: absolute;
      color: var(--accent-cyan);
      font-weight: bold;
      font-size: 18px;
      pointer-events: none;
      animation: floatUp 0.6s ease-out forwards;
      z-index: 10;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-40px); }
    }

    .overclock-btn {
      margin-top: 10px;
      background: linear-gradient(135deg, #ff0055, #ff5400);
      border: none;
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(255, 0, 85, 0.3);
    }

    .overclock-btn.disabled {
      background: #252a38;
      color: #5d677d;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Навигация */
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--card-bg);
      border-radius: 12px;
      padding: 3px;
      margin-bottom: 14px;
      border: 1px solid var(--card-border);
      gap: 4px;
    }

    .tab-btn {
      padding: 8px 4px;
      text-align: center;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 11px;
      border-radius: 8px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    /* Списки улучшений */
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .item-card.unlocked {
      border-color: rgba(16, 185, 129, 0.4);
    }

    .item-info {
      flex: 1;
    }

    .item-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }

    .item-desc {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .item-gain {
      font-size: 11px;
      color: var(--accent-green);
      font-weight: 600;
      margin-top: 2px;
    }

    .buy-btn {
      background: linear-gradient(135deg, var(--accent-purple), #7928ca);
      border: none;
      color: #fff;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 78px;
    }

    .buy-btn:active {
      transform: scale(0.95);
    }

    .buy-btn.disabled {
      background: #252a38 !important;
      color: #5d677d !important;
      opacity: 0.6;
    }

    /* Модальное окно событий */
    .event-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .event-card {
      background: #191f2d;
      border: 1px solid var(--accent-cyan);
      border-radius: 16px;
      padding: 18px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
    }

    .event-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent-cyan);
      margin-bottom: 6px;
    }

    .event-desc {
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .event-btn {
      background: linear-gradient(135deg, var(--accent-cyan), #0072ff);
      border: none;
      color: #000;
      font-weight: 800;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Модалка случайных ивентов -->
  <div class="event-overlay" id="event-modal">
    <div class="event-card">
      <div style="font-size: 36px; margin-bottom: 8px;" id="event-icon">⚡</div>
      <div class="event-title" id="event-title">Событие</div>
      <div class="event-desc" id="event-desc">Описание события</div>
      <button class="event-btn" onclick="closeEvent()">ПРИНЯТЬ</button>
    </div>
  </div>

  <!-- Главная плашка -->
  <div class="header-card">
    <div class="top-badges">
      <div class="badge" id="current-tier-badge">Уровень: Гараж</div>
      <div class="prestige-badge" id="stars-badge">⭐ 0 Звезд (+0%)</div>
    </div>
    <div style="font-size: 11px; color: var(--text-muted);">Сгенерировано токенов</div>
    <div class="balance-val" id="token-balance">0</div>
    <div class="stats-row">
      <div>Генерация: <strong id="tps-rate">+0.0 /c</strong></div>
      <div>Модель: <strong id="current-model-name">Qwen 2.5 Coder</strong></div>
    </div>
  </div>

  <!-- Ядро разметки данных + Турбо-буст -->
  <div class="core-section">
    <div class="ai-orb-container">
      <div class="pulse-ring"></div>
      <div class="ai-orb" id="orb-button">
        <span class="ai-orb-icon">🧠</span>
      </div>
    </div>
    <button class="overclock-btn" id="overclock-btn" onclick="triggerOverclock()">
      <span>⚡ РАЗГОН GPU (x5)</span>
      <span id="overclock-timer"></span>
    </button>
  </div>

  <!-- Навигация -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-btn-models" onclick="switchTab('models')">🧠 Модели</button>
    <button class="tab-btn" id="tab-btn-hw" onclick="switchTab('hardware')">🖥️ Железо</button>
    <button class="tab-btn" id="tab-btn-tech" onclick="switchTab('tech')">🔬 Наука</button>
    <button class="tab-btn" id="tab-btn-prestige" onclick="switchTab('prestige')">⭐ Опенсорс</button>
  </div>

  <!-- Списки вкладок -->
  <div class="cards-list" id="models-tab"></div>
  <div class="cards-list" id="hardware-tab" style="display: none;"></div>
  <div class="cards-list" id="tech-tab" style="display: none;"></div>
  <div class="cards-list" id="prestige-tab" style="display: none;"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor('#0b0d14');
    }

    let state = {
      tokens: 0,
      totalEarned: 0,
      currentModelIndex: 0,
      stars: 0,
      overclockUntil: 0,
      overclockCooldownUntil: 0
    };

    // 10 Моделей нейросетей
    const models = [
      { name: "Qwen 2.5 Coder (7B)", tier: "Гараж", cost: 0, rate: 1.0, icon: "⚡", unlocked: true },
      { name: "Llama 3.1 (8B)", tier: "Локалка", cost: 80, rate: 3.5, icon: "🦙", unlocked: false },
      { name: "Mistral NeMo (12B)", tier: "Инди", cost: 350, rate: 12.0, icon: "🌪️", unlocked: false },
      { name: "DeepSeek V3 (671B)", tier: "Стартап", cost: 1500, rate: 45.0, icon: "🔥", unlocked: false },
      { name: "Qwen 2.5 Max", tier: "Скейлинг", cost: 6000, rate: 160.0, icon: "🌌", unlocked: false },
      { name: "Claude 3.5 Sonnet", tier: "Продакшн", cost: 25000, rate: 580.0, icon: "💎", unlocked: false },
      { name: "DeepSeek R1 (Reasoning)", tier: "Мышление", cost: 100000, rate: 2200.0, icon: "🧩", unlocked: false },
      { name: "GPT-5 Orion", tier: "Корпорация", cost: 450000, rate: 8500.0, icon: "🌐", unlocked: false },
      { name: "Mythos 4 Omni", tier: "Прорыв", cost: 2000000, rate: 35000.0, icon: "🔮", unlocked: false },
      { name: "Mythos 5 (ASI)", tier: "Сингулярность", cost: 10000000, rate: 150000.0, icon: "👑", unlocked: false }
    ];

    // 8 Уровней оборудования
    const hardware = [
      { id: 'pc', name: 'Кластер RTX 4090', cost: 25, baseRate: 0.8, count: 0, icon: '🖥️' },
      { id: 'server', name: 'Сервер 8x H100 SXM', cost: 180, baseRate: 5.5, count: 0, icon: '🖲️' },
      { id: 'rack', name: 'Стойка Blackwell B200', cost: 950, baseRate: 28.0, count: 0, icon: '🏢' },
      { id: 'pod', name: 'Модульный ЦОД с чиллером', cost: 4800, baseRate: 130.0, count: 0, icon: '🏭' },
      { id: 'hydro', name: 'Подводный дата-центр', cost: 24000, baseRate: 620.0, count: 0, icon: '🌊' },
      { id: 'nuclear', name: 'Атомный суперкластер', cost: 120000, baseRate: 2900.0, count: 0, icon: '☢️' },
      { id: 'orbital', name: 'Орбитальный массив AI', cost: 650000, baseRate: 14000.0, count: 0, icon: '🛰️' },
      { id: 'dyson', name: 'Рой Дайсона у Звезды', cost: 3500000, baseRate: 75000.0, count: 0, icon: '☀️' }
    ];

    // Дерево исследований (Технологии)
    const techTree = [
      { id: 'cot', name: 'Chain of Thought (CoT)', desc: 'Утраивает силу ручного клика по ядру', cost: 100, bought: false, icon: '⛓️' },
      { id: 'flash', name: 'FlashAttention-3', desc: 'Снижает стоимость покупки оборудования на 20%', cost: 500, bought: false, icon: '⚡' },
      { id: 'rlhf', name: 'Синтетический RLHF', desc: '+50% к доходу от всех обученных моделей', cost: 2500, bought: false, icon: '🎯' },
      { id: 'moe', name: 'Mixture of Experts (MoE)', desc: 'Удваивает общую скорость генерации токенов', cost: 15000, bought: false, icon: '🔀' },
      { id: 'quant', name: 'FP4 Квантование', desc: 'Увеличивает доход оборудования на 75%', cost: 80000, bought: false, icon: '📦' }
    ];

    // Загрузка
    try {
      const saved = localStorage.getItem('ai_tycoon_v2_save');
      if (saved) {
        const parsed = JSON.parse(saved);
        state.tokens = parsed.tokens || 0;
        state.totalEarned = parsed.totalEarned || 0;
        state.currentModelIndex = parsed.currentModelIndex || 0;
        state.stars = parsed.stars || 0;
        if (parsed.models) parsed.models.forEach((u, i) => { if (models[i]) models[i].unlocked = u; });
        if (parsed.hardware) parsed.hardware.forEach((c, i) => { if (hardware[i]) hardware[i].count = c; });
        if (parsed.tech) parsed.tech.forEach((b, i) => { if (techTree[i]) techTree[i].bought = b; });
      }
    } catch (e) {}

    function saveGame() {
      try {
        localStorage.setItem('ai_tycoon_v2_save', JSON.stringify({
          tokens: state.tokens,
          totalEarned: state.totalEarned,
          currentModelIndex: state.currentModelIndex,
          stars: state.stars,
          models: models.map(m => m.unlocked),
          hardware: hardware.map(h => h.count),
          tech: techTree.map(t => t.bought)
        }));
      } catch (e) {}
    }

    function isOverclockActive() {
      return Date.now() < state.overclockUntil;
    }

    function getHwCost(idx) {
      let cost = hardware[idx].cost * Math.pow(1.15, hardware[idx].count);
      if (techTree.find(t => t.id === 'flash').bought) cost *= 0.8;
      return Math.floor(cost);
    }

    function getClickPower() {
      let power = state.currentModelIndex + 1;
      if (techTree.find(t => t.id === 'cot').bought) power *= 3;
      if (isOverclockActive()) power *= 5;
      const prestigeMult = 1 + (state.stars * 0.1);
      return Math.floor(power * prestigeMult);
    }

    function getTotalRate() {
      let modelIncome = models[state.currentModelIndex].rate;
      if (techTree.find(t => t.id === 'rlhf').bought) modelIncome *= 1.5;

      let hwIncome = hardware.reduce((sum, item) => {
        let rate = item.baseRate;
        if (techTree.find(t => t.id === 'quant').bought) rate *= 1.75;
        return sum + (item.count * rate);
      }, 0);

      let total = modelIncome + hwIncome;
      if (techTree.find(t => t.id === 'moe').bought) total *= 2;
      if (isOverclockActive()) total *= 5;

      const prestigeMult = 1 + (state.stars * 0.1);
      return total * prestigeMult;
    }

    function getPrestigeStarsReward() {
      if (state.totalEarned < 50000) return 0;
      return Math.floor(Math.sqrt(state.totalEarned / 50000));
    }

    // Инициализация интерфейса
    function initDOM() {
      // 1. Модели
      document.getElementById('models-tab').innerHTML = models.map((m, idx) => `
        <div class="item-card" id="model-card-${idx}">
          <div class="item-info">
            <div class="item-title">${m.icon} ${m.name}</div>
            <div class="item-desc">${m.tier} архитектура</div>
            <div class="item-gain">+${m.rate}/сек</div>
          </div>
          <button class="buy-btn" id="model-btn-${idx}" onclick="handleModelClick(${idx})"></button>
        </div>
      `).join('');

      // 2. Железо
      document.getElementById('hardware-tab').innerHTML = hardware.map((hw, idx) => `
        <div class="item-card">
          <div class="item-info">
            <div class="item-title" id="hw-title-${idx}">${hw.icon} ${hw.name} (${hw.count})</div>
            <div class="item-desc">Вычислительный кластер</div>
            <div class="item-gain">+${hw.baseRate}/сек за юнит</div>
          </div>
          <button class="buy-btn" id="hw-btn-${idx}" onclick="handleHwClick(${idx})">
            <span id="hw-cost-${idx}">0</span>
            <span style="font-size:9px; opacity:0.8;">КУПИТЬ</span>
          </button>
        </div>
      `).join('');

      // 3. Наука
      document.getElementById('tech-tab').innerHTML = techTree.map((t, idx) => `
        <div class="item-card" id="tech-card-${idx}">
          <div class="item-info">
            <div class="item-title">${t.icon} ${t.name}</div>
            <div class="item-desc">${t.desc}</div>
          </div>
          <button class="buy-btn" id="tech-btn-${idx}" onclick="handleTechClick(${idx})">
            <span id="tech-cost-${idx}">${t.cost} 🪙</span>
            <span style="font-size:9px; opacity:0.8;">ИЗУЧИТЬ</span>
          </button>
        </div>
      `).join('');

      // 4. Опенсорс Престиж
      document.getElementById('prestige-tab').innerHTML = `
        <div class="item-card" style="flex-direction: column; text-align: center; padding: 18px; border-color: rgba(255,183,3,0.3);">
          <div style="font-size: 38px;">⭐</div>
          <div class="item-title" style="font-size: 16px; margin: 6px 0;">Опенсорс-релиз (HuggingFace)</div>
          <div class="item-desc" style="font-size: 11px; margin-bottom: 12px;">
            Опубликуйте ваши веса в открытый доступ. Вы сбросите текущие токены, модели и сервера, но получите <b>⭐ Звезды репозитория</b>, навсегда увеличивающие весь доход на <b>+10% за каждую звезду</b>!
          </div>
          <button class="buy-btn" id="prestige-btn" style="width: 100%; background: linear-gradient(135deg, #ffb703, #fb8500); color: #000; font-size: 13px; padding: 12px;" onclick="handlePrestige()">
            СДЕЛАТЬ РЕЛИЗ (+0 ⭐)
          </button>
        </div>
      `;

      updateStaticUI();
    }

    function updateStaticUI() {
      models.forEach((m, idx) => {
        const btn = document.getElementById(`model-btn-${idx}`);
        const card = document.getElementById(`model-card-${idx}`);
        if (state.currentModelIndex === idx) {
          card.classList.add('unlocked');
          btn.innerHTML = `<span>АКТИВНА</span>`;
          btn.style.background = '#10b981';
        } else if (m.unlocked) {
          card.classList.remove('unlocked');
          btn.innerHTML = `<span>ВЫБРАТЬ</span>`;
          btn.style.background = 'linear-gradient(135deg, var(--accent-purple), #7928ca)';
        } else {
          card.classList.remove('unlocked');
          btn.innerHTML = `<span>${m.cost.toLocaleString()} 🪙</span><span style="font-size:9px; opacity:0.8;">ОБУЧИТЬ</span>`;
          btn.style.background = 'linear-gradient(135deg, var(--accent-purple), #7928ca)';
        }
      });

      hardware.forEach((hw, idx) => {
        document.getElementById(`hw-title-${idx}`).textContent = `${hw.icon} ${hw.name} (${hw.count})`;
        document.getElementById(`hw-cost-${idx}`).textContent = `${getHwCost(idx).toLocaleString()} 🪙`;
      });

      techTree.forEach((t, idx) => {
        const btn = document.getElementById(`tech-btn-${idx}`);
        const card = document.getElementById(`tech-card-${idx}`);
        if (t.bought) {
          card.classList.add('unlocked');
          btn.innerHTML = `<span>ИЗУЧЕНО</span>`;
          btn.style.background = '#10b981';
        }
      });

      document.getElementById('current-model-name').textContent = models[state.currentModelIndex].name;
      document.getElementById('current-tier-badge').textContent = `Уровень: ${models[state.currentModelIndex].tier}`;
      document.getElementById('stars-badge').textContent = `⭐ ${state.stars} Звезд (+${state.stars * 10}%)`;
      document.getElementById('tps-rate').textContent = `+${getTotalRate().toFixed(1)} /c`;
    }

    function tickUI() {
      document.getElementById('token-balance').textContent = Math.floor(state.tokens).toLocaleString();

      // Доступность моделей
      models.forEach((m, idx) => {
        const btn = document.getElementById(`model-btn-${idx}`);
        if (!m.unlocked && state.tokens < m.cost) btn.classList.add('disabled');
        else btn.classList.remove('disabled');
      });

      // Доступность железа
      hardware.forEach((hw, idx) => {
        const btn = document.getElementById(`hw-btn-${idx}`);
        if (state.tokens < getHwCost(idx)) btn.classList.add('disabled');
        else btn.classList.remove('disabled');
      });

      // Доступность науки
      techTree.forEach((t, idx) => {
        const btn = document.getElementById(`tech-btn-${idx}`);
        if (!t.bought && state.tokens < t.cost) btn.classList.add('disabled');
        else btn.classList.remove('disabled');
      });

      // Турбо кнопка
      const now = Date.now();
      const orb = document.getElementById('orb-button');
      const turboBtn = document.getElementById('overclock-btn');
      const timerSpan = document.getElementById('overclock-timer');

      if (now < state.overclockUntil) {
        orb.classList.add('overclocked');
        turboBtn.classList.remove('disabled');
        const left = Math.ceil((state.overclockUntil - now) / 1000);
        timerSpan.textContent = `(${left}с)`;
      } else {
        orb.classList.remove('overclocked');
        if (now < state.overclockCooldownUntil) {
          turboBtn.classList.add('disabled');
          const left = Math.ceil((state.overclockCooldownUntil - now) / 1000);
          timerSpan.textContent = `(Кулдаун ${left}с)`;
        } else {
          turboBtn.classList.remove('disabled');
          timerSpan.textContent = `(ГОТОВО)`;
        }
      }

      // Престиж кнопка
      const prestigeGain = getPrestigeStarsReward();
      const pBtn = document.getElementById('prestige-btn');
      if (pBtn) {
        pBtn.textContent = prestigeGain > 0 ? `СДЕЛАТЬ РЕЛИЗ (+${prestigeGain} ⭐)` : `НУЖНО 50K ТОКЕНОВ ДЛЯ РЕЛИЗА`;
        if (prestigeGain <= 0) pBtn.classList.add('disabled');
        else pBtn.classList.remove('disabled');
      }
    }

    // Обработчики кликов
    window.handleModelClick = function(idx) {
      if (state.currentModelIndex === idx) return;
      if (models[idx].unlocked) {
        state.currentModelIndex = idx;
        if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        updateStaticUI();
        saveGame();
      } else if (state.tokens >= models[idx].cost) {
        state.tokens -= models[idx].cost;
        models[idx].unlocked = true;
        state.currentModelIndex = idx;
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        updateStaticUI();
        saveGame();
      }
    };

    window.handleHwClick = function(idx) {
      const cost = getHwCost(idx);
      if (state.tokens >= cost) {
        state.tokens -= cost;
        hardware[idx].count++;
        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        updateStaticUI();
        saveGame();
      }
    };

    window.handleTechClick = function(idx) {
      if (techTree[idx].bought) return;
      if (state.tokens >= techTree[idx].cost) {
        state.tokens -= techTree[idx].cost;
        techTree[idx].bought = true;
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        updateStaticUI();
        saveGame();
      }
    };

    window.triggerOverclock = function() {
      const now = Date.now();
      if (now < state.overclockCooldownUntil || now < state.overclockUntil) return;
      state.overclockUntil = now + 15000; // 15 сек активности
      state.overclockCooldownUntil = now + 60000; // 60 сек кулдаун
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
      updateStaticUI();
    };

    window.handlePrestige = function() {
      const reward = getPrestigeStarsReward();
      if (reward <= 0) return;

      state.stars += reward;
      state.tokens = 0;
      state.totalEarned = 0;
      state.currentModelIndex = 0;
      models.forEach((m, i) => m.unlocked = (i === 0));
      hardware.forEach(h => h.count = 0);
      techTree.forEach(t => t.bought = false);

      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      updateStaticUI();
      saveGame();
      switchTab('models');
    };

    // Клик по ядру
    const orb = document.getElementById('orb-button');
    orb.addEventListener('pointerdown', (e) => {
      const gain = getClickPower();
      state.tokens += gain;
      state.totalEarned += gain;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

      const text = document.createElement('div');
      text.className = 'floating-text';
      text.textContent = `+${gain}`;
      text.style.left = `${e.clientX - 10}px`;
      text.style.top = `${e.clientY - 20}px`;
      document.body.appendChild(text);
      setTimeout(() => text.remove(), 600);
      tickUI();
    });

    window.switchTab = function(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('models-tab').style.display = 'none';
      document.getElementById('hardware-tab').style.display = 'none';
      document.getElementById('tech-tab').style.display = 'none';
      document.getElementById('prestige-tab').style.display = 'none';

      if (tab === 'models') {
        document.getElementById('tab-btn-models').classList.add('active');
        document.getElementById('models-tab').style.display = 'flex';
      } else if (tab === 'hardware') {
        document.getElementById('tab-btn-hw').classList.add('active');
        document.getElementById('hardware-tab').style.display = 'flex';
      } else if (tab === 'tech') {
        document.getElementById('tab-btn-tech').classList.add('active');
        document.getElementById('tech-tab').style.display = 'flex';
      } else {
        document.getElementById('tab-btn-prestige').classList.add('active');
        document.getElementById('prestige-tab').style.display = 'flex';
      }
    };

    // Случайные события (каждые 45 секунд)
    const events = [
      { icon: '🚀', title: 'Хайп в соцсетях!', desc: 'Ваша модель завирусилась на бенчмарках. Инвесторы вложили токены!', reward: () => getTotalRate() * 30 + 150 },
      { icon: '💎', title: 'Грант от облачного гиганта', desc: 'Вам выделили бесплатные мощности на вычисления.', reward: () => getTotalRate() * 45 + 300 },
      { icon: '🧩', title: 'Удачный синтетический датасет', desc: 'Очищенные данные ускорили обучение нейросети.', reward: () => getTotalRate() * 20 + 80 }
    ];

    let currentEventReward = 0;
    function triggerRandomEvent() {
      const ev = events[Math.floor(Math.random() * events.length)];
      currentEventReward = Math.floor(ev.reward());
      document.getElementById('event-icon').textContent = ev.icon;
      document.getElementById('event-title').textContent = ev.title;
      document.getElementById('event-desc').textContent = `${ev.desc}\n\nБонус: +${currentEventReward.toLocaleString()} 🪙`;
      document.getElementById('event-modal').style.display = 'flex';
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
    }

    window.closeEvent = function() {
      state.tokens += currentEventReward;
      state.totalEarned += currentEventReward;
      document.getElementById('event-modal').style.display = 'none';
      tickUI();
      saveGame();
    };

    setInterval(() => {
      if (Math.random() < 0.6) triggerRandomEvent();
    }, 45000);

    initDOM();

    // Игровой цикл пассивного дохода
    setInterval(() => {
      const income = getTotalRate() / 10;
      state.tokens += income;
      state.totalEarned += income;
      tickUI();
    }, 100);

    // Автосохранение
    setInterval(saveGame, 3000);
  </script>
</body>
</html>
