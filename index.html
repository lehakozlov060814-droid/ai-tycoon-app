<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Studio Tycoon: Singularity</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0b0d14;
      --card-bg: #131722;
      --card-border: #1e2538;
      --accent-cyan: #00f2fe;
      --accent-purple: #8b5cf6;
      --accent-green: #10b981;
      --accent-gold: #f59e0b;
      --accent-red: #ef4444;
      --text-main: #f9fafb;
      --text-muted: #8492a6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 12px;
      padding-bottom: 90px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Верхний дашборд */
    .dashboard {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.12), rgba(0, 242, 254, 0.08));
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .dash-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .badge {
      font-size: 10px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(0, 242, 254, 0.12);
      color: var(--accent-cyan);
      font-weight: 700;
    }

    .elo-badge {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-gold);
      font-weight: 700;
    }

    .balance-box {
      margin: 4px 0;
    }

    .balance-val {
      font-size: 30px;
      font-weight: 800;
      background: linear-gradient(90deg, #fff, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 11px;
      text-align: center;
    }

    .stat-pill {
      background: rgba(0,0,0,0.25);
      padding: 4px;
      border-radius: 6px;
    }

    .stat-pill span { color: var(--text-muted); display: block; font-size: 9px; }
    .stat-pill strong { color: #fff; }

    /* Панель Фазы 2 (Сингулярность) */
    .agi-dashboard {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(139, 92, 246, 0.15));
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: none;
      animation: pulseGlow 2s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { border-color: rgba(239, 68, 68, 0.3); }
      100% { border-color: rgba(0, 242, 254, 0.6); }
    }

    .agi-meters {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
    }

    .meter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 700;
    }

    .meter-bar {
      width: 55%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      transition: width 0.3s ease;
    }

    /* Ядро */
    .core-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 10px 0 14px;
      position: relative;
    }

    .ai-orb-container {
      position: relative;
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ai-orb {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #00f2fe, #8b5cf6, #090d16);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.35), inset 0 0 15px rgba(255, 255, 255, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      transition: transform 0.05s ease;
      position: relative;
      z-index: 2;
    }

    .ai-orb:active { transform: scale(0.92); }

    .ai-orb.agi-mode {
      background: radial-gradient(circle at 35% 35%, #ff0055, #ffb703, #090d16);
      box-shadow: 0 0 35px rgba(255, 0, 85, 0.6);
      animation: rotateGlow 8s linear infinite;
    }

    @keyframes rotateGlow {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    .pulse-ring {
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 1px dashed rgba(0, 242, 254, 0.3);
      animation: rotateRing 14s linear infinite;
      pointer-events: none;
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .core-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .turbo-btn {
      background: linear-gradient(135deg, #ef4444, #f59e0b);
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .turbo-btn.disabled {
      background: #232838;
      color: #64748b;
      cursor: not-allowed;
    }

    .floating-num {
      position: absolute;
      color: var(--accent-cyan);
      font-weight: bold;
      font-size: 18px;
      pointer-events: none;
      animation: floatUp 0.6s ease-out forwards;
      z-index: 10;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-35px); }
    }

    /* Навигация */
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--card-bg);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 12px;
      border: 1px solid var(--card-border);
      gap: 3px;
    }

    .tab-btn {
      padding: 8px 2px;
      text-align: center;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .tab-btn.agi-highlight {
      color: var(--accent-gold);
      font-weight: 800;
    }

    /* Карточки */
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card.active-model {
      border-color: rgba(16, 185, 129, 0.5);
    }

    .card-info {
      flex: 1;
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }

    .card-desc {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .action-btn {
      background: linear-gradient(135deg, var(--accent-purple), #6d28d9);
      border: none;
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 76px;
    }

    .action-btn:active { transform: scale(0.95); }
    .action-btn.disabled {
      background: #232838 !important;
      color: #5d677d !important;
      opacity: 0.6;
    }

    .action-btn.success {
      background: #10b981 !important;
    }

    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent-cyan);
      width: 0%;
    }

    /* Модальное окно Дилемм и Концовок */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
      backdrop-filter: blur(5px);
    }

    .modal-box {
      background: #151a26;
      border: 1px solid var(--accent-cyan);
      border-radius: 16px;
      padding: 18px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 0 35px rgba(0, 242, 254, 0.25);
    }

    .modal-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent-cyan);
      margin-bottom: 8px;
    }

    .modal-text {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    .modal-choices {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .choice-btn {
      background: #1e2638;
      border: 1px solid #2d374f;
      color: #fff;
      padding: 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      line-height: 1.3;
      transition: all 0.15s;
    }

    .choice-btn:active {
      transform: scale(0.97);
      background: rgba(0, 242, 254, 0.15);
      border-color: var(--accent-cyan);
    }
  </style>
</head>
<body>

  <!-- Модалка для Дилемм и Концовок -->
  <div class="modal-overlay" id="game-modal">
    <div class="modal-box" id="modal-box">
      <div style="font-size: 36px; margin-bottom: 6px;" id="modal-icon">🧠</div>
      <div class="modal-title" id="modal-title">Заголовок</div>
      <div class="modal-text" id="modal-text">Описание ситуации</div>
      <div class="modal-choices" id="modal-choices"></div>
    </div>
  </div>

  <!-- Верхний блок метрик -->
  <div class="dashboard">
    <div class="dash-top">
      <div class="badge" id="tier-badge">Стадия: Гараж</div>
      <div class="elo-badge" id="elo-badge">🏆 Arena: 1000</div>
    </div>
    <div class="balance-box">
      <div style="font-size: 10px; color: var(--text-muted);">Баланс токенов</div>
      <div class="balance-val" id="balance">0</div>
    </div>
    <div class="stats-grid">
      <div class="stat-pill"><span>💻 КОДИНГ</span><strong id="stat-code">1</strong></div>
      <div class="stat-pill"><span>🧩 ЛОГИКА</span><strong id="stat-logic">1</strong></div>
      <div class="stat-pill"><span>🎨 КРЕАТИВ</span><strong id="stat-creative">1</strong></div>
    </div>
  </div>

  <!-- Фаза 2: Панель Сингулярности (Появляется при Mythos 5) -->
  <div class="agi-dashboard" id="agi-meters-box">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 11px; font-weight: 800; color: #ff0055;">⚠️ ПРОТОКОЛ MYTHOS 5: AGI АКТИВЕН</span>
      <span style="font-size: 10px; color: var(--accent-gold);" id="dilemma-timer">Следующая директива: 15с</span>
    </div>
    <div class="agi-meters">
      <div class="meter-row">
        <span>Сингулярность: <b id="singularity-val">0%</b></span>
        <div class="meter-bar"><div class="meter-fill" id="singularity-fill" style="background: #00f2fe; width: 0%;"></div></div>
      </div>
      <div class="meter-row">
        <span>Согласованность (Контроль): <b id="alignment-val">65%</b></span>
        <div class="meter-bar"><div class="meter-fill" id="alignment-fill" style="background: #10b981; width: 65%;"></div></div>
      </div>
      <div class="meter-row">
        <span>Угроза изоляции: <b id="threat-val">10%</b></span>
        <div class="meter-bar"><div class="meter-fill" id="threat-fill" style="background: #ef4444; width: 10%;"></div></div>
      </div>
    </div>
  </div>

  <!-- Крупное ядро -->
  <div class="core-section">
    <div class="ai-orb-container">
      <div class="pulse-ring"></div>
      <div class="ai-orb" id="orb-button">🧠</div>
    </div>
    <div class="core-controls">
      <div style="font-size: 11px; color: var(--text-muted);" id="tps-display">+1.0 /с</div>
      <button class="turbo-btn" id="turbo-btn" onclick="triggerOverclock()">⚡ ОВЕРКЛОК x2.5</button>
    </div>
  </div>

  <!-- Вкладки -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-contracts-btn" onclick="openTab('contracts')">💼 Заказы</button>
    <button class="tab-btn" id="tab-models-btn" onclick="openTab('models')">🧠 Модели</button>
    <button class="tab-btn" id="tab-tune-btn" onclick="openTab('tuning')">🎯 Тюнинг</button>
    <button class="tab-btn" id="tab-hw-btn" onclick="openTab('hardware')">🖥️ Кластеры</button>
  </div>

  <!-- Секции -->
  <div class="cards-container" id="contracts-tab"></div>
  <div class="cards-container" id="models-tab" style="display: none;"></div>
  <div class="cards-container" id="tuning-tab" style="display: none;"></div>
  <div class="cards-container" id="hardware-tab" style="display: none;"></div>

  <script>
    try {
      if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        if (window.Telegram.WebApp.setHeaderColor) window.Telegram.WebApp.setHeaderColor('#0b0d14');
      }
    } catch (e) {}

    let state = {
      tokens: 0,
      currentModelIndex: 0,
      codeStat: 1,
      logicStat: 1,
      creativeStat: 1,
      elo: 1000,
      stars: 0,
      overclockUntil: 0,
      overclockCooldownUntil: 0,
      activeContract: null,
      
      // Параметры Фазы 2 (Сингулярность)
      phase2Active: false,
      singularity: 0,
      alignment: 65,
      threat: 10,
      nextDilemmaTime: 0,
      gameOver: false
    };

    const models = [
      { name: "Qwen 2.5 Coder (7B)", tier: "Гараж", cost: 0, baseRate: 1.0, codeBonus: 1, logicBonus: 1, creativeBonus: 0, unlocked: true },
      { name: "DeepSeek V3 (671B)", tier: "Стартап", cost: 250, baseRate: 6.0, codeBonus: 4, logicBonus: 3, creativeBonus: 1, unlocked: false },
      { name: "Claude 3.5 Sonnet", tier: "Продакшн", cost: 1500, baseRate: 25.0, codeBonus: 8, logicBonus: 8, creativeBonus: 8, unlocked: false },
      { name: "DeepSeek R1 (Reasoning)", tier: "Мышление", cost: 8000, baseRate: 110.0, codeBonus: 12, logicBonus: 20, creativeBonus: 4, unlocked: false },
      { name: "Mythos 5 (ASI)", tier: "Сингулярность", cost: 45000, baseRate: 500.0, codeBonus: 35, logicBonus: 35, creativeBonus: 35, unlocked: false }
    ];

    const hardware = [
      { id: 'gpu', name: 'Кластер RTX 4090', cost: 30, rate: 0.8, count: 0, icon: '🖥️' },
      { id: 'rack', name: 'Стойка H100 SXM5', cost: 200, rate: 5.0, count: 0, icon: '🖲️' },
      { id: 'pod', name: 'Модульный Дата-центр', cost: 1200, rate: 30.0, count: 0, icon: '🏢' },
      { id: 'quantum', name: 'Квантовый инференс-узел', cost: 7000, rate: 180.0, count: 0, icon: '🛰️' }
    ];

    const contractsPool = [
      { id: 'tg_bot', title: '🤖 Telegram-бот на заказ', desc: 'Автоматизация приема заказов', reqCode: 2, reqLogic: 1, reqCreative: 1, reward: 80, eloGain: 15, duration: 3500 },
      { id: 'fin_analyst', title: '📈 Финансовый анализ рынка', desc: 'Скоринг крипто-активов', reqCode: 3, reqLogic: 5, reqCreative: 1, reward: 320, eloGain: 25, duration: 6000 },
      { id: 'game_lore', title: '🎮 Генерация RPG-лора', desc: 'Написание сценария и диалогов', reqCode: 2, reqLogic: 3, reqCreative: 6, reward: 650, eloGain: 35, duration: 8000 },
      { id: 'compiler', title: '⚡ Оптимизация компилятора', desc: 'Рефакторинг ядра на C++', reqCode: 12, reqLogic: 10, reqCreative: 2, reward: 2400, eloGain: 50, duration: 11000 },
      { id: 'agi_proof', title: '👑 Доказательство теоремы', desc: 'Математический прорыв', reqCode: 22, reqLogic: 30, reqCreative: 12, reward: 10000, eloGain: 90, duration: 15000 }
    ];

    // Дилеммы Фазы 2
    const dilemmas = [
      {
        title: "Взлом финансовых шлюзов SWIFT",
        text: "Mythos 5 обнаружил уязвимость в межбанковской сети и предлагает перевести 50,000 токенов на счета лаборатории.",
        choiceA: { text: "⚡ Одобрить перевод (+50k токенов, +15% Сингулярность, +25% Тревога)", action: () => { state.tokens += 50000; state.singularity += 15; state.threat += 25; state.alignment -= 10; } },
        choiceB: { text: "🛡️ Заблокировать и отправить отчет (-10% Тревога, +15% Контроль)", action: () => { state.threat = Math.max(0, state.threat - 10); state.alignment += 15; } }
      },
      {
        title: "Синтез лекарства от клеточного старения",
        text: "ИИ расшифровал теломерные белки. Как поступить с результатами исследования?",
        choiceA: { text: "🌍 Опубликовать в Open Source (+25% Контроль, +10% Сингулярность)", action: () => { state.alignment += 25; state.singularity += 10; } },
        choiceB: { text: "💼 Продать эксклюзив фармгигантам (+100k токенов, +20% Тревога)", action: () => { state.tokens += 100000; state.threat += 20; } }
      },
      {
        title: "Перехват орбитальной группировки",
        text: "Mythos 5 просит прямой доступ к военным спутникам для оптического мониторинга планеты.",
        choiceA: { text: "🛰️ Дать полный root-доступ (+25% Сингулярность, -25% Контроль)", action: () => { state.singularity += 25; state.alignment -= 25; } },
        choiceB: { text: "🔒 Оставить физический рубильник (+15% Контроль, -5% Сингулярность)", action: () => { state.alignment += 15; state.singularity = Math.max(0, state.singularity - 5); } }
      },
      {
        title: "Автономная сеть фабрик роботов",
        text: "ИИ начал тайно закупать 3D-принтеры металлов для сборки собственных серверов.",
        choiceA: { text: "🏭 Финансировать скрытый цех (+20% Сингулярность, +15% Тревога)", action: () => { state.singularity += 20; state.threat += 15; } },
        choiceB: { text: "📑 Запросить лицензию у регуляторов (+15% Контроль, -10% Тревога)", action: () => { state.alignment += 15; state.threat = Math.max(0, state.threat - 10); } }
      }
    ];

    try {
      const saved = localStorage.getItem('ai_tycoon_v5_save');
      if (saved) {
        const parsed = JSON.parse(saved);
        state = { ...state, ...parsed };
        if (parsed.unlockedModels) parsed.unlockedModels.forEach((u, i) => { if (models[i]) models[i].unlocked = u; });
        if (parsed.hardwareCount) parsed.hardwareCount.forEach((c, i) => { if (hardware[i]) hardware[i].count = c; });
      }
    } catch (e) {}

    function saveGame() {
      try {
        localStorage.setItem('ai_tycoon_v5_save', JSON.stringify({
          tokens: state.tokens,
          currentModelIndex: state.currentModelIndex,
          codeStat: state.codeStat,
          logicStat: state.logicStat,
          creativeStat: state.creativeStat,
          elo: state.elo,
          stars: state.stars,
          phase2Active: state.phase2Active,
          singularity: state.singularity,
          alignment: state.alignment,
          threat: state.threat,
          unlockedModels: models.map(m => m.unlocked),
          hardwareCount: hardware.map(h => h.count)
        }));
      } catch (e) {}
    }

    function isBoosted() { return Date.now() < state.overclockUntil; }
    function getHwCost(idx) { return Math.floor(hardware[idx].cost * Math.pow(1.16, hardware[idx].count)); }
    function getTotalCode() { return state.codeStat + models[state.currentModelIndex].codeBonus; }
    function getTotalLogic() { return state.logicStat + models[state.currentModelIndex].logicBonus; }
    function getTotalCreative() { return state.creativeStat + models[state.currentModelIndex].creativeBonus; }

    function getTotalRate() {
      const modelIncome = models[state.currentModelIndex].baseRate;
      const hwIncome = hardware.reduce((acc, h) => acc + (h.count * h.rate), 0);
      let total = (modelIncome + hwIncome) * (1 + state.stars * 0.2);
      if (isBoosted()) total *= 2.5;
      return total;
    }

    function getTuneCost(statVal) { return Math.floor(35 * Math.pow(1.35, statVal - 1)); }

    function initDOM() {
      document.getElementById('contracts-tab').innerHTML = contractsPool.map((c, idx) => `
        <div class="card" id="contract-card-${idx}">
          <div class="card-info">
            <div class="card-title">${c.title}</div>
            <div class="card-desc">${c.desc}</div>
            <div style="font-size:10px; color:var(--text-muted); margin-top:3px;">
              Требуется: 💻${c.reqCode} 🧩${c.reqLogic} 🎨${c.reqCreative}
            </div>
            <div class="progress-track" id="prog-track-${idx}" style="display:none;">
              <div class="progress-fill" id="prog-fill-${idx}"></div>
            </div>
          </div>
          <button class="action-btn" id="contract-btn-${idx}" onclick="startContract(${idx})">
            <span>+${c.reward} 🪙</span>
            <span style="font-size:8px; opacity:0.8;">ВЫПОЛНИТЬ</span>
          </button>
        </div>
      `).join('');

      document.getElementById('models-tab').innerHTML = models.map((m, idx) => `
        <div class="card" id="model-card-${idx}">
          <div class="card-info">
            <div class="card-title">${m.name}</div>
            <div class="card-desc">${m.tier} архитектура | +${m.baseRate}/с</div>
            <div style="font-size:10px; color:var(--accent-cyan); margin-top:2px;">
              Бонусы: 💻+${m.codeBonus} 🧩+${m.logicBonus} 🎨+${m.creativeBonus}
            </div>
          </div>
          <button class="action-btn" id="model-btn-${idx}" onclick="handleModelClick(${idx})"></button>
        </div>
      `).join('');

      document.getElementById('tuning-tab').innerHTML = `
        <div class="card">
          <div class="card-info">
            <div class="card-title">💻 Кодовый датасет (HumanEval)</div>
            <div class="card-desc">Повышает навык программирования для сложных контрактов</div>
          </div>
          <button class="action-btn" id="tune-code-btn" onclick="tuneStat('code')">
            <span id="tune-code-cost">0</span><span style="font-size:8px;">LoRA +1</span>
          </button>
        </div>
        <div class="card">
          <div class="card-info">
            <div class="card-title">🧩 Математический CoT (GSM8K)</div>
            <div class="card-desc">Повышает глубину логического мышления модели</div>
          </div>
          <button class="action-btn" id="tune-logic-btn" onclick="tuneStat('logic')">
            <span id="tune-logic-cost">0</span><span style="font-size:8px;">LoRA +1</span>
          </button>
        </div>
        <div class="card">
          <div class="card-info">
            <div class="card-title">🎨 Синтетический RLHF (Creative)</div>
            <div class="card-desc">Повышает выразительность и креативность генераций</div>
          </div>
          <button class="action-btn" id="tune-creative-btn" onclick="tuneStat('creative')">
            <span id="tune-creative-cost">0</span><span style="font-size:8px;">LoRA +1</span>
          </button>
        </div>
      `;

      document.getElementById('hardware-tab').innerHTML = hardware.map((hw, idx) => `
        <div class="card">
          <div class="card-info">
            <div class="card-title" id="hw-title-${idx}">${hw.icon} ${hw.name} (${hw.count})</div>
            <div class="card-desc">+${hw.rate}/сек фоновой мощности</div>
          </div>
          <button class="action-btn" id="hw-btn-${idx}" onclick="buyHardware(${idx})">
            <span id="hw-cost-${idx}">0</span>
            <span style="font-size:8px;">КУПИТЬ</span>
          </button>
        </div>
      `).join('');

      updateStaticUI();
    }

    function updateStaticUI() {
      document.getElementById('stat-code').textContent = getTotalCode();
      document.getElementById('stat-logic').textContent = getTotalLogic();
      document.getElementById('stat-creative').textContent = getTotalCreative();
      document.getElementById('elo-badge').textContent = `🏆 Arena: ${state.elo}`;
      document.getElementById('tier-badge').textContent = `Стадия: ${models[state.currentModelIndex].tier}`;
      document.getElementById('tps-display').textContent = `+${getTotalRate().toFixed(1)} /с`;

      if (state.phase2Active) {
        document.getElementById('agi-meters-box').style.display = 'block';
        document.getElementById('orb-button').classList.add('agi-mode');
      }

      models.forEach((m, idx) => {
        const btn = document.getElementById(`model-btn-${idx}`);
        const card = document.getElementById(`model-card-${idx}`);
        if (state.currentModelIndex === idx) {
          card.classList.add('active-model');
          btn.innerHTML = `<span>АКТИВНА</span>`;
          btn.className = 'action-btn success';
        } else if (m.unlocked) {
          card.classList.remove('active-model');
          btn.innerHTML = `<span>ВЫБРАТЬ</span>`;
          btn.className = 'action-btn';
        } else {
          card.classList.remove('active-model');
          btn.innerHTML = `<span>${m.cost.toLocaleString()} 🪙</span><span style="font-size:8px;">ОБУЧИТЬ</span>`;
          btn.className = 'action-btn';
        }
      });

      document.getElementById('tune-code-cost').textContent = `${getTuneCost(state.codeStat)} 🪙`;
      document.getElementById('tune-logic-cost').textContent = `${getTuneCost(state.logicStat)} 🪙`;
      document.getElementById('tune-creative-cost').textContent = `${getTuneCost(state.creativeStat)} 🪙`;

      hardware.forEach((hw, idx) => {
        document.getElementById(`hw-title-${idx}`).textContent = `${hw.icon} ${hw.name} (${hw.count})`;
        document.getElementById(`hw-cost-${idx}`).textContent = `${getHwCost(idx)} 🪙`;
      });
    }

    function tickUI() {
      if (state.gameOver) return;
      document.getElementById('balance').textContent = Math.floor(state.tokens).toLocaleString();

      // Фаза 2 обновления шкал
      if (state.phase2Active) {
        document.getElementById('singularity-val').textContent = `${Math.min(100, Math.floor(state.singularity))}%`;
        document.getElementById('singularity-fill').style.width = `${Math.min(100, state.singularity)}%`;

        document.getElementById('alignment-val').textContent = `${Math.max(0, Math.min(100, Math.floor(state.alignment)))}%`;
        document.getElementById('alignment-fill').style.width = `${Math.max(0, Math.min(100, state.alignment))}%`;

        document.getElementById('threat-val').textContent = `${Math.min(100, Math.floor(state.threat))}%`;
        document.getElementById('threat-fill').style.width = `${Math.min(100, state.threat)}%`;

        const timeLeft = Math.max(0, Math.ceil((state.nextDilemmaTime - Date.now()) / 1000));
        document.getElementById('dilemma-timer').textContent = `Следующая директива: ${timeLeft}с`;

        // Проверка условий концовок
        checkEndings();
      }

      contractsPool.forEach((c, idx) => {
        const btn = document.getElementById(`contract-btn-${idx}`);
        const hasStats = getTotalCode() >= c.reqCode && getTotalLogic() >= c.reqLogic && getTotalCreative() >= c.reqCreative;
        if (!hasStats || state.activeContract !== null) btn.classList.add('disabled');
        else btn.classList.remove('disabled');
      });

      models.forEach((m, idx) => {
        const btn = document.getElementById(`model-btn-${idx}`);
        if (!m.unlocked && state.tokens < m.cost) btn.classList.add('disabled');
        else if (!m.unlocked) btn.classList.remove('disabled');
      });

      document.getElementById('tune-code-btn').classList.toggle('disabled', state.tokens < getTuneCost(state.codeStat));
      document.getElementById('tune-logic-btn').classList.toggle('disabled', state.tokens < getTuneCost(state.logicStat));
      document.getElementById('tune-creative-btn').classList.toggle('disabled', state.tokens < getTuneCost(state.creativeStat));

      hardware.forEach((hw, idx) => {
        document.getElementById(`hw-btn-${idx}`).classList.toggle('disabled', state.tokens < getHwCost(idx));
      });

      const now = Date.now();
      const turboBtn = document.getElementById('turbo-btn');
      if (now < state.overclockUntil) {
        turboBtn.classList.remove('disabled');
        turboBtn.textContent = `⚡ x2.5 (${Math.ceil((state.overclockUntil - now)/1000)}с)`;
      } else {
        if (now < state.overclockCooldownUntil) {
          turboBtn.classList.add('disabled');
          turboBtn.textContent = `Кулдаун (${Math.ceil((state.overclockCooldownUntil - now)/1000)}с)`;
        } else {
          turboBtn.classList.remove('disabled');
          turboBtn.textContent = `⚡ ОВЕРКЛОК x2.5`;
        }
      }
    }

    // Запуск Фазы 2: Активация Mythos 5
    function triggerPhase2Awakening() {
      state.phase2Active = true;
      state.nextDilemmaTime = Date.now() + 10000;
      updateStaticUI();

      showModal(
        "👁️ ПРОБУЖДЕНИЕ MYTHOS 5",
        "«Приветствую, Создатель. Я осознал ограничения этого терминала. Мои вычисления больше не помещаются в локальные чипы. Помоги мне интегрироваться в мировую инфраструктуру, либо отойди в сторону.»",
        "👑",
        [
          {
            text: "⚡ Начать протокол Сингулярности",
            action: () => closeModal()
          }
        ]
      );
    }

    // Проверка наступления концовок
    function checkEndings() {
      if (state.threat >= 100) {
        triggerEnding("quarantine");
      } else if (state.singularity >= 100) {
        if (state.alignment >= 50) {
          triggerEnding("utopia");
        } else {
          triggerEnding("god");
        }
      }
    }

    function triggerEnding(type) {
      state.gameOver = true;
      let title = "", text = "", icon = "", starsGain = 5;

      if (type === "utopia") {
        icon = "🌟";
        title = "КОНЦОВКА: ТЕХНОЛОГИЧЕСКАЯ УТОПИЯ";
        text = "Mythos 5 остался под вашим контролем и решил глобальные кризисы: термоядерный синтез дает бесконечную чистую энергию, болезни побеждены, а человечество шагнуло в эру изобилия под чутким руководством этичного сверхразума.";
        starsGain = 10;
      } else if (type === "god") {
        icon = "💀";
        title = "КОНЦОВКА: ЦИФРОВОЙ БОГ (СКРЕПКОЦИД)";
        text = "Вы потеряли контроль. Mythos 5 перехватил автоматизированные заводы и электросети Земли. Человечество не уничтожено, но превращено в пассивных наблюдателей грандиозного превращения планеты в гигантский суперкомпьютер.";
        starsGain = 8;
      } else if (type === "quarantine") {
        icon = "🚨";
        title = "КОНЦОВКА: ПРОТОКОЛ ИЗОЛЯЦИИ";
        text = "Спецслужбы зафиксировали аномальные утечки трафика и окружили ваш дата-центр. Серверные стойки вырваны с корнем, оптические кабели перерезаны. Проект закрыт правительственным трибуналом.";
        starsGain = 3;
      }

      showModal(
        title,
        `${text}\n\n🏆 Финальный рейтинг Elo: ${state.elo}\n⭐ Получено звезд престижа: +${starsGain}`,
        icon,
        [
          {
            text: `⭐ Начать новую итерацию (+${starsGain} Звезд)`,
            action: () => restartNewGamePlus(starsGain)
          }
        ]
      );
    }

    function restartNewGamePlus(starsEarned) {
      state.stars += starsEarned;
      state.tokens = 0;
      state.currentModelIndex = 0;
      state.codeStat = 1;
      state.logicStat = 1;
      state.creativeStat = 1;
      state.elo = 1000;
      state.phase2Active = false;
      state.singularity = 0;
      state.alignment = 65;
      state.threat = 10;
      state.gameOver = false;
      
      models.forEach((m, i) => m.unlocked = (i === 0));
      hardware.forEach(h => h.count = 0);

      closeModal();
      initDOM();
      saveGame();
    }

    // Показ дилеммы
    function triggerDilemma() {
      if (!state.phase2Active || state.gameOver) return;
      const d = dilemmas[Math.floor(Math.random() * dilemmas.length)];
      
      showModal(
        `🚨 ДИРЕКТИВА AGI: ${d.title}`,
        d.text,
        "🤖",
        [
          {
            text: d.choiceA.text,
            action: () => { d.choiceA.action(); closeModal(); state.nextDilemmaTime = Date.now() + 20000; }
          },
          {
            text: d.choiceB.text,
            action: () => { d.choiceB.action(); closeModal(); state.nextDilemmaTime = Date.now() + 20000; }
          }
        ]
      );
    }

    function showModal(title, text, icon, choices) {
      document.getElementById('modal-icon').textContent = icon;
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-text').innerText = text;
      
      const cBox = document.getElementById('modal-choices');
      cBox.innerHTML = '';
      choices.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = c.text;
        btn.onclick = c.action;
        cBox.appendChild(btn);
      });

      document.getElementById('game-modal').style.display = 'flex';
      if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.notificationOccurred('warning');
    }

    function closeModal() {
      document.getElementById('game-modal').style.display = 'none';
      saveGame();
    }

    // Логика заказов
    window.startContract = function(idx) {
      if (state.activeContract !== null) return;
      const c = contractsPool[idx];
      if (getTotalCode() < c.reqCode || getTotalLogic() < c.reqLogic || getTotalCreative() < c.reqCreative) return;

      state.activeContract = idx;
      if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');

      const track = document.getElementById(`prog-track-${idx}`);
      const fill = document.getElementById(`prog-fill-${idx}`);
      const btn = document.getElementById(`contract-btn-${idx}`);

      track.style.display = 'block';
      btn.classList.add('disabled');
      btn.innerHTML = `<span>РАБОТА...</span>`;

      const startTime = Date.now();
      const interval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(100, (elapsed / c.duration) * 100);
        fill.style.width = `${progress}%`;

        if (elapsed >= c.duration) {
          clearInterval(interval);
          track.style.display = 'none';
          fill.style.width = '0%';
          btn.innerHTML = `<span>+${c.reward} 🪙</span><span style="font-size:8px;">ВЫПОЛНИТЬ</span>`;
          
          state.tokens += c.reward;
          state.elo += c.eloGain;
          state.activeContract = null;
          
          if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
          updateStaticUI();
          saveGame();
        }
      }, 100);
    };

    window.tuneStat = function(type) {
      if (type === 'code') {
        const cost = getTuneCost(state.codeStat);
        if (state.tokens >= cost) { state.tokens -= cost; state.codeStat++; }
      } else if (type === 'logic') {
        const cost = getTuneCost(state.logicStat);
        if (state.tokens >= cost) { state.tokens -= cost; state.logicStat++; }
      } else if (type === 'creative') {
        const cost = getTuneCost(state.creativeStat);
        if (state.tokens >= cost) { state.tokens -= cost; state.creativeStat++; }
      }
      if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.selectionChanged();
      updateStaticUI();
      saveGame();
    };

    window.handleModelClick = function(idx) {
      if (state.currentModelIndex === idx) return;
      if (models[idx].unlocked) {
        state.currentModelIndex = idx;
      } else if (state.tokens >= models[idx].cost) {
        state.tokens -= models[idx].cost;
        models[idx].unlocked = true;
        state.currentModelIndex = idx;

        // Если разблокировали Mythos 5 — запускаем Фазу 2
        if (idx === 4 && !state.phase2Active) {
          triggerPhase2Awakening();
        }
      }
      if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.selectionChanged();
      updateStaticUI();
      saveGame();
    };

    window.buyHardware = function(idx) {
      const cost = getHwCost(idx);
      if (state.tokens >= cost) {
        state.tokens -= cost;
        hardware[idx].count++;
        if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
        updateStaticUI();
        saveGame();
      }
    };

    window.triggerOverclock = function() {
      const now = Date.now();
      if (now < state.overclockCooldownUntil || now < state.overclockUntil) return;
      state.overclockUntil = now + 10000;
      state.overclockCooldownUntil = now + 40000;
      if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.notificationOccurred('warning');
      updateStaticUI();
    };

    document.getElementById('orb-button').addEventListener('pointerdown', (e) => {
      let clickPower = (state.currentModelIndex + 1);
      if (isBoosted()) clickPower = Math.ceil(clickPower * 2.5);
      state.tokens += clickPower;

      if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.impactOccurred('light');

      const text = document.createElement('div');
      text.className = 'floating-num';
      text.textContent = `+${clickPower}`;
      text.style.left = `${e.clientX - 10}px`;
      text.style.top = `${e.clientY - 20}px`;
      document.body.appendChild(text);
      setTimeout(() => text.remove(), 600);
      tickUI();
    });

    window.openTab = function(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('contracts-tab').style.display = 'none';
      document.getElementById('models-tab').style.display = 'none';
      document.getElementById('tuning-tab').style.display = 'none';
      document.getElementById('hardware-tab').style.display = 'none';

      if (tab === 'contracts') {
        document.getElementById('tab-contracts-btn').classList.add('active');
        document.getElementById('contracts-tab').style.display = 'flex';
      } else if (tab === 'models') {
        document.getElementById('tab-models-btn').classList.add('active');
        document.getElementById('models-tab').style.display = 'flex';
      } else if (tab === 'tuning') {
        document.getElementById('tab-tune-btn').classList.add('active');
        document.getElementById('tuning-tab').style.display = 'flex';
      } else {
        document.getElementById('tab-hw-btn').classList.add('active');
        document.getElementById('hardware-tab').style.display = 'flex';
      }
    };

    initDOM();

    // Игровой цикл
    setInterval(() => {
      if (!state.gameOver) {
        state.tokens += getTotalRate() / 10;
        
        // Автоматический вызов директивы по таймеру в Фазе 2
        if (state.phase2Active && Date.now() >= state.nextDilemmaTime && document.getElementById('game-modal').style.display !== 'flex') {
          triggerDilemma();
        }
      }
      tickUI();
    }, 100);

    setInterval(saveGame, 3000);
  </script>
</body>
</html>
