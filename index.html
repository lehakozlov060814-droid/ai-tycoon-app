<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Tycoon: From Qwen to Mythos</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0d0f17;
      --card-bg: #161b26;
      --card-border: #232d42;
      --accent-cyan: #00f2fe;
      --accent-purple: #9d4edd;
      --accent-green: #10b981;
      --text-main: #f3f4f6;
      --text-muted: #8492a6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      padding-bottom: 90px;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Верхняя панель со статистикой */
    .header-card {
      background: linear-gradient(135deg, rgba(157, 78, 221, 0.15), rgba(0, 242, 254, 0.15));
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(0, 242, 254, 0.15);
      color: var(--accent-cyan);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .balance-container {
      margin: 6px 0;
    }

    .balance-label {
      font-size: 12px;
      color: var(--text-muted);
    }

    .balance-val {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(90deg, #fff, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
    }

    .stat-item span {
      color: var(--text-muted);
    }

    .stat-item strong {
      color: var(--accent-green);
    }

    /* Интерактивная сфера обучения */
    .core-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 24px 0;
      position: relative;
    }

    .ai-orb-container {
      position: relative;
      width: 170px;
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ai-orb {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #00f2fe, #7928ca, #0b0f19);
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s ease;
      position: relative;
      z-index: 2;
    }

    .ai-orb:active {
      transform: scale(0.93);
    }

    .ai-orb-icon {
      font-size: 46px;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
    }

    .pulse-ring {
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: 1px dashed rgba(0, 242, 254, 0.4);
      animation: rotateRing 14s linear infinite;
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .floating-text {
      position: absolute;
      color: var(--accent-cyan);
      font-weight: bold;
      font-size: 18px;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 10;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-50px); }
    }

    .orb-hint {
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Навигация по вкладкам */
    .tabs {
      display: flex;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 16px;
      border: 1px solid var(--card-border);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    /* Список карточек улучшений */
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.2s;
    }

    .item-card.unlocked {
      border-color: rgba(16, 185, 129, 0.4);
    }

    .item-info {
      flex: 1;
    }

    .item-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .item-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .item-gain {
      font-size: 12px;
      color: var(--accent-green);
      font-weight: 600;
      margin-top: 4px;
    }

    .buy-btn {
      background: linear-gradient(135deg, var(--accent-purple), #7928ca);
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 80px;
      transition: opacity 0.15s;
    }

    .buy-btn:disabled {
      background: #252a38;
      color: #5d677d;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Шапка статистики -->
  <div class="header-card">
    <div class="badge" id="current-tier-badge">Уровень: Гаражный кодинг</div>
    <div class="balance-container">
      <div class="balance-label">Сгенерировано токенов</div>
      <div class="balance-val" id="token-balance">0</div>
    </div>
    <div class="stats-row">
      <div class="stat-item"><span>Генерация:</span> <strong id="tps-rate">+0.0 /c</strong></div>
      <div class="stat-item"><span>Модель:</span> <strong id="current-model-name">Qwen Coder 7B</strong></div>
    </div>
  </div>

  <!-- Центральная сфера майнинга / разметки данных -->
  <div class="core-section">
    <div class="ai-orb-container">
      <div class="pulse-ring"></div>
      <div class="ai-orb" id="orb-button">
        <span class="ai-orb-icon">🧠</span>
      </div>
    </div>
    <div class="orb-hint">Тапайте по ядру для разметки синтетических данных</div>
  </div>

  <!-- Переключатель вкладок -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('models')">Архитектуры AI</button>
    <button class="tab-btn" onclick="switchTab('hardware')">Кластеры / TPU</button>
  </div>

  <!-- Список моделей -->
  <div class="cards-list" id="models-tab"></div>

  <!-- Список оборудования -->
  <div class="cards-list" id="hardware-tab" style="display: none;"></div>

  <script>
    // Инициализация Telegram WebApp API
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor('#0d0f17');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#0d0f17');
    }

    // Игровое состояние
    let state = {
      tokens: 0,
      tokensPerClick: 1,
      currentModelIndex: 0
    };

    const models = [
      { name: "Qwen Coder 7B", tier: "Гараж", cost: 0, rate: 0.5, icon: "⚡", unlocked: true },
      { name: "DeepSeek 67B", tier: "Стартап", cost: 150, rate: 4.0, icon: "🔥", unlocked: false },
      { name: "Llama 3 405B", tier: "Скейлинг", cost: 800, rate: 25.0, icon: "🌌", unlocked: false },
      { name: "Claude 3.5 Opus", tier: "Корпорация", cost: 3500, rate: 120.0, icon: "💎", unlocked: false },
      { name: "Mythos 5 (AGI)", tier: "Сингулярность", cost: 15000, rate: 600.0, icon: "👑", unlocked: false }
    ];

    const hardware = [
      { id: 'gpu', name: 'RTX 4090 Кластер', cost: 30, baseRate: 0.8, count: 0, icon: '🖥️' },
      { id: 'rack', name: 'Стойка H100 SXM5', cost: 250, baseRate: 6.0, count: 0, icon: '🖲️' },
      { id: 'datacenter', name: 'Дата-центр с подстанцией', cost: 1200, baseRate: 35.0, count: 0, icon: '🏢' },
      { id: 'orbital', name: 'Орбитальный квантовый массив', cost: 6000, baseRate: 180.0, count: 0, icon: '🛰️' }
    ];

    // Расчет суммарного дохода в секунду
    function getTotalRate() {
      const modelIncome = models[state.currentModelIndex].rate;
      const hwIncome = hardware.reduce((sum, item) => sum + (item.count * item.baseRate), 0);
      return modelIncome + hwIncome;
    }

    // Обновление интерфейса
    function updateUI() {
      document.getElementById('token-balance').textContent = Math.floor(state.tokens).toLocaleString();
      document.getElementById('tps-rate').textContent = `+${getTotalRate().toFixed(1)} /c`;
      document.getElementById('current-model-name').textContent = models[state.currentModelIndex].name;
      document.getElementById('current-tier-badge').textContent = `Уровень: ${models[state.currentModelIndex].tier}`;
      
      renderModels();
      renderHardware();
    }

    // Тап по ядру
    const orb = document.getElementById('orb-button');
    orb.addEventListener('pointerdown', (e) => {
      state.tokens += state.tokensPerClick;
      
      // Haptic Feedback для Telegram
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }

      // Анимация всплывающего числа
      const text = document.createElement('div');
      text.className = 'floating-text';
      text.textContent = `+${state.tokensPerClick}`;
      text.style.left = `${e.clientX - 10}px`;
      text.style.top = `${e.clientY - 20}px`;
      document.body.appendChild(text);
      setTimeout(() => text.remove(), 800);

      updateUI();
    });

    // Рендер моделей
    function renderModels() {
      const container = document.getElementById('models-tab');
      container.innerHTML = models.map((m, idx) => {
        const isCurrent = state.currentModelIndex === idx;
        const isUnlocked = m.unlocked;
        const canAfford = state.tokens >= m.cost;

        let btnContent = '';
        if (isCurrent) {
          btnContent = `<button class="buy-btn" disabled style="background:#10b981;">АКТИВНА</button>`;
        } else if (isUnlocked) {
          btnContent = `<button class="buy-btn" onclick="selectModel(${idx})">ВЫБРАТЬ</button>`;
        } else {
          btnContent = `<button class="buy-btn" ${!canAfford ? 'disabled' : ''} onclick="unlockModel(${idx})">
                          <span>${m.cost} 🪙</span>
                          <span style="font-size:9px; opacity:0.8;">ОБУЧИТЬ</span>
                        </button>`;
        }

        return `
          <div class="item-card ${isCurrent ? 'unlocked' : ''}">
            <div class="item-info">
              <div class="item-title">${m.icon} ${m.name}</div>
              <div class="item-desc">${m.tier} архитектура</div>
              <div class="item-gain">+${m.rate}/сек к генерации</div>
            </div>
            ${btnContent}
          </div>
        `;
      }).join('');
    }

    // Рендер оборудования
    function renderHardware() {
      const container = document.getElementById('hardware-tab');
      container.innerHTML = hardware.map((hw, idx) => {
        const cost = Math.floor(hw.cost * Math.pow(1.15, hw.count));
        const canAfford = state.tokens >= cost;

        return `
          <div class="item-card">
            <div class="item-info">
              <div class="item-title">${hw.icon} ${hw.name} (${hw.count})</div>
              <div class="item-desc">Кластерное ускорение вычислений</div>
              <div class="item-gain">+${hw.baseRate}/сек за блок</div>
            </div>
            <button class="buy-btn" ${!canAfford ? 'disabled' : ''} onclick="buyHardware(${idx}, ${cost})">
              <span>${cost} 🪙</span>
              <span style="font-size:9px; opacity:0.8;">КУПИТЬ</span>
            </button>
          </div>
        `;
      }).join('');
    }

    // Покупка модели
    window.unlockModel = function(idx) {
      if (state.tokens >= models[idx].cost) {
        state.tokens -= models[idx].cost;
        models[idx].unlocked = true;
        state.currentModelIndex = idx;
        state.tokensPerClick = idx + 1;
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        updateUI();
      }
    };

    window.selectModel = function(idx) {
      state.currentModelIndex = idx;
      state.tokensPerClick = idx + 1;
      updateUI();
    };

    // Покупка железа
    window.buyHardware = function(idx, cost) {
      if (state.tokens >= cost) {
        state.tokens -= cost;
        hardware[idx].count++;
        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        updateUI();
      }
    };

    // Вкладки
    window.switchTab = function(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (tabName === 'models') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('models-tab').style.display = 'flex';
        document.getElementById('hardware-tab').style.display = 'none';
      } else {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('models-tab').style.display = 'none';
        document.getElementById('hardware-tab').style.display = 'flex';
      }
    };

    // Игровой цикл пассивного дохода (10 раз в секунду)
    setInterval(() => {
      state.tokens += getTotalRate() / 10;
      updateUI();
    }, 100);

    updateUI();
  </script>
</body>
</html>
